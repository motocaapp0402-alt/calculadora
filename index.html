<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora do Marcos</title>
    <style>
        body { display: flex; justify-content: center; align-items: center; height: 100vh; background: #1e1e1e; font-family: Arial; margin: 0; }
        .calculadora { background: #333; padding: 20px; border-radius: 10px; box-shadow: 0 0 20px #000; }
        #display { width: 100%; height: 60px; font-size: 2rem; text-align: right; margin-bottom: 10px; border: none; background: #444; color: #fff; padding: 10px; box-sizing: border-box; border-radius: 5px; }
        .botoes { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; }
        button { padding: 20px; font-size: 1.2rem; border: none; border-radius: 5px; background: #555; color: #fff; cursor: pointer; }
        button:hover { background: #666; }
        .operador { background: #ff9500; }
        .operador:hover { background: #ffaa33; }
        .igual { background: #007aff; grid-column: span 2; }
    </style>
</head>
<body>
    <div class="calculadora">
        <input type="text" id="display" disabled>
        <div class="botoes">
            <button onclick="limpar()">C</button>
            <button onclick="apagar()">←</button>
            <button onclick="add('%')" class="operador">%</button>
            <button onclick="add('/')" class="operador">÷</button>
            <button onclick="add('7')">7</button>
            <button onclick="add('8')">8</button>
            <button onclick="add('9')">9</button>
            <button onclick="add('*')" class="operador">×</button>
            <button onclick="add('4')">4</button>
            <button onclick="add('5')">5</button>
            <button onclick="add('6')">6</button>
            <button onclick="add('-')" class="operador">-</button>
            <button onclick="add('1')">1</button>
            <button onclick="add('2')">2</button>
            <button onclick="add('3')">3</button>
            <button onclick="add('+')" class="operador">+</button>
            <button onclick="add('0')">0</button>
            <button onclick="add('.')">.</button>
            <button onclick="calcular()" class="igual">=</button>
        </div>
    </div>
    <script>
        let display = document.getElementById('display');
        function add(valor) { display.value += valor; }
        function limpar() { display.value = ''; }
        function apagar() { display.value = display.value.slice(0, -1); }
        function calcular() {
            try { display.value = eval(display.value); }
            catch { display.value = 'Erro'; }
        }
    </script>
</body>
</html>
